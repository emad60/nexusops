# Alembic configuration. The database URL is resolved from app settings at
# runtime (see alembic/env.py) so credentials never live in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Template used for autogenerated revision files.
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
