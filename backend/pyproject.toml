[project]
name = "nexusops-backend"
version = "1.0.0"
description = "NexusOps control-plane API, workers and domain services"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy[asyncio]>=2.0.43",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.16",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.10",
    "redis>=6.4",
    "celery[redis]>=5.5",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "cryptography>=45",
    "httpx>=0.28",
    "structlog>=25.4",
    "docker>=7.1",
    "tenacity>=9.1",
    # Directly imported by app/services/dns_verifier.py for authoritative NS/TXT
    # queries. It already arrived transitively via email-validator; declaring it
    # keeps an unrelated upgrade from silently removing the dependency.
    "dnspython>=2.8",
    "orjson>=3.11",
    "prometheus-client>=0.23",
    # RFC 8555 client (Phase 5.3): directory, nonce/Replay-Nonce handling, JWS
    # signing and order polling are the library's job, never re-implemented here.
    # ``acme`` is the same maintained client certbot ships, and it pulls
    # ``josepy`` (declared explicitly below because app/services/acme/ imports it
    # directly to build JWKs and compute DNS-01 values).
    "acme>=5.1",
    "josepy>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=7",
    "ruff>=0.13",
    "mypy>=1.18",
    "faker>=37",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit
    "ASYNC",    # async pitfalls
    "RUF",
]
ignore = [
    "E501",     # line length handled by formatter
    "B008",     # FastAPI Depends() in defaults is idiomatic
    "S101",     # asserts are fine outside prod paths; tests rely on them
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
# The Pebble harness starts and stops its own compose stack. The argv is built
# from `shutil.which("docker")` plus constants and a repository path — there is
# no untrusted input in it — but bandit cannot see that, so the check is scoped
# to the one file that shells out.
"tests/integration/test_certificate_pebble.py" = ["S603"]
"backend/app/core/config.py" = []
"**/migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict_optional = true
disallow_untyped_defs = false
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^migrations/", "^build/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL + Redis",
    "pebble: requires the isolated Pebble + authoritative-DNS stack (docker)",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*"]
