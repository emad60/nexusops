# Development overrides: hot reload everywhere, Vite exposed, code bind-mounted.
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG

  worker:
    command: watchfiles --filter python 'celery -A app.tasks.celery_app:app worker --loglevel=INFO --concurrency=4'
    volumes:
      - ./backend/app:/app/app
    environment:
      LOG_LEVEL: DEBUG

  scheduler:
    volumes:
      - ./backend/app:/app/app
    environment:
      LOG_LEVEL: DEBUG

  frontend:
    # Dev: serve Vite instead of the built static bundle.
    build:
      context: ./frontend
      target: develop
    command: pnpm dev --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "${NEXUSOPS_VITE_PORT:-5173}:5173"

  nginx:
    # Same edge template as production; only the web upstream differs (vite
    # listens on 5173, not 8080). Mounting the real template keeps this file
    # from drifting — dev.conf used to be referenced here but never existed.
    environment:
      WEB_UPSTREAM: frontend:5173
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
