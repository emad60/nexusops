# NexusOps full stack. Start everything:  docker compose up -d
# Dev overrides (hot reload):             docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Edge (nginx) → http://localhost:${NEXUSOPS_HTTP_PORT:-8080}
name: nexusops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${NEXUSOPS_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    ports:
      - "127.0.0.1:${NEXUSOPS_REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    # SMTP sink + web UI for development notifications.
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:${NEXUSOPS_MAILPIT_HTTP_PORT:-8025}:8025"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexusops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexusops}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexusops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexusops}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      RUN_MIGRATIONS_ON_START: "false"
    command: celery -A app.tasks.celery_app:app worker --loglevel=INFO --concurrency=4 --max-tasks-per-child=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL so $HOSTNAME expands at check time; the array form passes it
      # through literally and no node ever replies.
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME --timeout=8"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexusops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexusops}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      RUN_MIGRATIONS_ON_START: "false"
    command: celery -A app.tasks.celery_app:app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      # Loopback only: the edge is always fronted by a host proxy in production;
      # nothing needs to reach it from off-box.
      - "127.0.0.1:${NEXUSOPS_HTTP_PORT:-8080}:8080"
    environment:
      API_UPSTREAM: api:8000
      WEB_UPSTREAM: frontend:8080
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
