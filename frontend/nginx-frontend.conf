# Static SPA serving inside the frontend container.
server {
    listen 8080;
    server_name _;

    # Fingerprinting hardening: hide the exact nginx build.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side router owns every non-file path.
    location / {
        add_header X-Content-Type-Options nosniff always;
        # The admin SPA drives infrastructure actions: a restrictive CSP is
        # the backstop that turns a future injected script into a broken
        # page instead of an exfiltration channel. Vite injects styles at
        # runtime, hence style-src 'unsafe-inline'; the app is same-origin
        # only (API calls and WebSocket streams included).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
